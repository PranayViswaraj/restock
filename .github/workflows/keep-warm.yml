# OPTIONAL: keep the free Render instance awake while judges are testing
# (1-15 December only), so nobody waits 30-60 seconds for a cold start.
#
# Budget check: Render's free plan gives 750 instance-hours per month. One service
# awake all month is ~744 hours, so only use this if Restock is your ONLY free
# Render service. Delete this file if you don't want it.
# GitHub may delay scheduled runs by a few minutes; that's fine here.
#
# Needs the RESTOCK_URL repository secret (see daily-agent.yml).
name: Keep demo awake (judging period)

on:
  schedule:
    - cron: '*/10 * 1-15 12 *' # every 10 minutes, 1-15 December
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        env:
          RESTOCK_URL: ${{ secrets.RESTOCK_URL }}
        run: |
          [ -z "$RESTOCK_URL" ] && { echo "RESTOCK_URL secret not set"; exit 0; }
          curl --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 "$RESTOCK_URL/api/health"
