# Daily agent check (free alternative to a Render cron job, which is a paid feature).
# Calls the deployed app's protected endpoint once a day. The server then runs the
# normal Scout -> Guardian -> Treasurer pipeline, with every rule still enforced.
#
# Setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   RESTOCK_URL  = https://<your-service>.onrender.com   (no trailing slash)
#   CRON_SECRET  = the same random value you set as CRON_SECRET on Render
name: Daily agent check

on:
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC = 7:00 in Austin (CST)
  workflow_dispatch: {}  # "Run workflow" button for a manual test

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the daily run (waits for a sleeping free instance to wake)
        env:
          RESTOCK_URL: ${{ secrets.RESTOCK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$RESTOCK_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the RESTOCK_URL and CRON_SECRET repository secrets first."; exit 1
          fi
          # Wake the service first (free instances sleep after ~15 min idle).
          curl --silent --show-error --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 "$RESTOCK_URL/api/health"
          echo
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$RESTOCK_URL/api/cron/daily-run" \
            -H "Authorization: Bearer $CRON_SECRET"
